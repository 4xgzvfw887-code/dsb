[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeforge"
version = "1.0.0"
description = "TradeForge AI – modular algorithmic trading bot with risk controls, paper trading, and backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "TradeForge" }]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "scikit-learn>=1.4.0",
  "ta>=0.11.0",
  "ccxt>=4.2.0",
  "yfinance>=0.2.36",
  "streamlit>=1.31.0",
  "plotly>=5.18.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tradeforge = "tradeforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
